name: Import reviewed admin implementation
on:
  push:
    branches: [gpt/admin-control-center]
    paths: [.github/workflows/admin-import.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/gpt/admin-control-center'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/admin-control-center
      - name: Verify transfer and baseline before writing any source
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib
          root = pathlib.Path.cwd()
          raw = base64.b64decode(''.join((root / f'.github/admin-transfer/part{i}.txt').read_text().strip() for i in range(1,6)), validate=True)
          assert hashlib.sha256(raw).hexdigest() == '96dde6ccdc418457d9a914b6cac74c71cbc85b899bf66054dca1d87f65d09892', 'Transfer hash mismatch'
          entries = json.loads(lzma.decompress(raw))
          allowed = set('''.github/workflows/admin-ui.yml
          client/src/components/admin/admin-api.ts
          client/src/components/admin/admin-common.tsx
          client/src/components/admin/admin-confirm.tsx
          client/src/components/admin/admin-directories.tsx
          client/src/components/admin/admin-parts.tsx
          client/src/components/admin/admin-providers.tsx
          client/src/components/admin/admin-runtime.tsx
          client/src/components/admin/admin-shell.tsx
          client/src/components/admin/admin-system.tsx
          client/src/components/admin/admin-types.ts
          client/src/components/admin/admin-users.tsx
          client/src/components/admin/admin-verifications.tsx
          client/src/components/admin/admin.css
          client/src/components/admin/directory-fields.tsx
          client/src/pages/admin/dashboard.tsx
          docs/admin-panel.md
          script/test-admin-access.ts
          script/test-admin-ui.cjs
          script/test-admin-users-db.ts
          server/admin-access.ts
          server/admin-routes.ts
          server/admin-user-routes.ts
          server/index.ts
          shared/admin-users.ts'''.splitlines())
          allowed = {p.strip() for p in allowed}
          assert len(entries) == 25 and {e['path'] for e in entries} == allowed
          for e in entries:
              p = root / e['path']
              assert p.resolve().is_relative_to(root) and not p.is_symlink()
              if e['old'] is None:
                  assert not p.exists(), f'New file already exists: {p}'
              else:
                  assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest() == e['old'], f'Baseline changed: {p}'
          for e in entries:
              p = root / e['path']
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(e['content'], encoding='utf-8')
          print('Validated and staged 25 admin implementation and test files.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify typed code and regression suite
        run: npm run check && npx tsx script/test-admin-access.ts && npm run test:product && npm run build && npm run smoke:build
      - name: Commit reviewed source and remove temporary transfer files
        run: |
          test "$(git branch --show-current)" = 'gpt/admin-control-center'
          rm -rf .github/admin-transfer
          rm .github/workflows/admin-workspace.yml .github/workflows/admin-import.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client server shared script docs .github
          git commit -m 'feat: mobile-first admin control center with guarded management and user directory'
          git push origin HEAD:refs/heads/gpt/admin-control-center
          git rev-parse HEAD
