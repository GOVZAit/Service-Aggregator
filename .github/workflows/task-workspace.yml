name: Product maturity workspace
on:
  push:
    branches: [gpt/product-maturity]
    paths: [.github/workflows/task-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: product-source
          path: ${{ runner.temp }}/source.tar.gz
          retention-days: 1
      - run: npm ci
      - run: tar -czf "$RUNNER_TEMP/dependencies.tar.gz" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: product-dependencies
          path: ${{ runner.temp }}/dependencies.tar.gz
          retention-days: 1
