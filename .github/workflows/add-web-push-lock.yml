name: Add web push dependency

on:
  push:
    branches:
      - feat/pwa-providers-push

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[web-push-lock]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pwa-providers-push
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: |
          npm install web-push@^3.6.7 --save
          npm install @types/web-push@^3.6.4 --save-dev
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add package.json package-lock.json
          git commit -m "Add web push dependency [web-push-lock]"
          git push origin HEAD:feat/pwa-providers-push
