name: Release database safety
on:
  pull_request:
  push:
    branches: [gpt/admin-control-center]
permissions:
  contents: read
concurrency:
  group: release-db-${{ github.ref }}
  cancel-in-progress: true
jobs:
  database-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: govza_release_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      restore-postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: govza_restore_test
        ports: [5433:5432]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:test@localhost:5432/govza_release_test
      RESTORE_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5433/govza_restore_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect PostgreSQL clients against an empty fixture database
        run: |
          pg_dump --version
          pg_restore --version
          PGDATABASE="$DATABASE_URL" PGCONNECT_TIMEOUT=5 pg_dump --no-password --schema-only --file=/dev/null
      - name: Typecheck release tools
        run: npx tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution bundler --esModuleInterop --types node script/release-database.ts script/check-release-db.ts script/test-release-database.ts
      - name: Verify schema gate and restore fixtures into empty service database
        run: npx tsx script/test-release-database.ts
