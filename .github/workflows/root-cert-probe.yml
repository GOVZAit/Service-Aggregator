name: Root SSH probe

on:
  push:
    branches:
      - ops/root-cert-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
      - name: Show deploy public key\n        run: ssh-keygen -y -f ~/.ssh/id_ed25519\n      - name: Probe root key login
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          getent ahostsv4 "$DEPLOY_HOST" | head -n 3 || true
          set +e
          ssh -o BatchMode=yes -o PasswordAuthentication=no root@"$DEPLOY_HOST" 'id -u; whoami'
          rc=$?
          echo "ROOT_KEY_RC=$rc"
          exit 0
