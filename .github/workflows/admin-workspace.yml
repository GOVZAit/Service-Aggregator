name: Admin review source
on:
  push:
    branches: [gpt/admin-control-center]
    paths: [.github/workflows/admin-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar HEAD client server shared script docs package.json package-lock.json tsconfig.json tailwind.config.ts vite.config.ts postcss.config.js drizzle.config.ts .github/workflows > "$RUNNER_TEMP/admin-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: admin-source
          path: ${{ runner.temp }}/admin-source.tar
          retention-days: 2
