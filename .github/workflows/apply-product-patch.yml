name: Verify product maturity patch
on:
  push:
    branches: [gpt/product-maturity]
    paths: [.github/workflows/apply-product-patch.yml]
permissions:
  contents: write
jobs:
  verify-and-commit:
    if: github.ref == 'refs/heads/gpt/product-maturity'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: govza_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/product-maturity
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply checksum-verified source edits
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path, PurePosixPath
          chunks = sorted(Path('.github').glob('product-edits.part*.b64'))
          assert [p.name for p in chunks] == [f'product-edits.part{i}.b64' for i in range(4)]
          raw = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in chunks), validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'fce63aea4a2846bc04172f6cd11c3b3016a11d4a1b89c52ae4e02944ebdfc289'
          manifest = json.loads(raw)
          seen = set()
          for change in manifest['files']:
              name = change['path']
              pure = PurePosixPath(name)
              assert not pure.is_absolute() and '..' not in pure.parts and name not in seen
              seen.add(name)
              path = Path(name)
              assert not path.is_symlink()
              before = path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(before).hexdigest() if before is not None else None) == change['before'], f'Source changed: {name}'
              if change.get('delete'):
                  path.unlink()
                  continue
              lines = (before or b'').decode('utf-8').splitlines(keepends=True)
              for start, end, text in reversed(change['edits']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = text.splitlines(keepends=True)
              result = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(result).hexdigest() == change['after'], f'Output mismatch: {name}'
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(result)
          for path in chunks:
              path.unlink()
          Path('.github/workflows/apply-product-patch.yml').unlink()
          print(f'Applied and verified {len(seen)} paths; removed temporary transport files.')
          PY
      - run: npm ci
      - name: TypeScript
        run: npm run check
      - name: Product regression tests
        run: npm run test:product
      - name: Production build
        run: npm run build
      - name: Production artifact smoke test
        run: npm run smoke:build
      - name: Isolated PostgreSQL and HTTP tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:test@localhost:5432/govza_test
        run: npm run test:product:db
      - name: Commit verified source files to feature branch only
        shell: bash
        run: |
          test "$(git branch --show-current)" = "gpt/product-maturity"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          # GITHUB_TOKEN has no workflow-write permission. Keep workflows unchanged;
          # the authorized GitHub connector will apply CI changes and remove helpers.
          git restore --source=HEAD --staged --worktree .github/workflows
          git diff --cached --stat
          git commit -m 'feat: persistent client memory, reliable availability and smarter catalog'
          git push origin HEAD:gpt/product-maturity
