name: Provision fresh Service Aggregator VPS

on:
  push:
    branches:
      - ops/fresh-new-vps

permissions:
  contents: read

concurrency:
  group: service-aggregator-fresh-vps
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    env:
      NEW_HOST: 194.67.92.216
      DEPLOY_USER: serviceagg-deploy

    steps:
      - name: Check out provisioning branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install bootstrap SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Configure deploy key and host verification
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$NEW_HOST" > ~/.ssh/known_hosts

      - name: Detect root-password secret name
        env:
          HAS_NEW_VPS_ROOT_PASSWORD: ${{ secrets.NEW_VPS_ROOT_PASSWORD != '' }}
          HAS_VPS_ROOT_PASSWORD: ${{ secrets.VPS_ROOT_PASSWORD != '' }}
          HAS_ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD != '' }}
          HAS_NEW_SERVER_PASSWORD: ${{ secrets.NEW_SERVER_PASSWORD != '' }}
        run: |
          echo "NEW_VPS_ROOT_PASSWORD=$HAS_NEW_VPS_ROOT_PASSWORD"
          echo "VPS_ROOT_PASSWORD=$HAS_VPS_ROOT_PASSWORD"
          echo "ROOT_PASSWORD=$HAS_ROOT_PASSWORD"
          echo "NEW_SERVER_PASSWORD=$HAS_NEW_SERVER_PASSWORD"

      - name: Verify temporary root password access
        env:
          SSHPASS: ${{ secrets.NEW_VPS_ROOT_PASSWORD || secrets.VPS_ROOT_PASSWORD || secrets.ROOT_PASSWORD || secrets.NEW_SERVER_PASSWORD }}
        run: |
          test -n "$SSHPASS"
          sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            root@"$NEW_HOST" 'id -u | grep -qx 0'

      - name: Bootstrap clean server
        env:
          SSHPASS: ${{ secrets.NEW_VPS_ROOT_PASSWORD || secrets.VPS_ROOT_PASSWORD || secrets.ROOT_PASSWORD || secrets.NEW_SERVER_PASSWORD }}
        run: |
          deploy_public_key="$(ssh-keygen -y -f ~/.ssh/id_ed25519)"
          sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            root@"$NEW_HOST" 'install -d -m 0700 /root/service-aggregator-bootstrap'
          sshpass -e scp -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            deploy/deploy-service-aggregator \
            deploy/service-aggregator.service \
            deploy/bootstrap-fresh-service-aggregator \
            deploy/issue-govza-certificate \
            root@"$NEW_HOST":/root/service-aggregator-bootstrap/
          sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            root@"$NEW_HOST" "chmod 0700 /root/service-aggregator-bootstrap/bootstrap-fresh-service-aggregator /root/service-aggregator-bootstrap/issue-govza-certificate && /root/service-aggregator-bootstrap/bootstrap-fresh-service-aggregator '$deploy_public_key'"

      - name: Deploy current main through restricted deploy user
        run: |
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          git archive --format=tar.gz --output=release.tar.gz "$main_sha"
          scp release.tar.gz "$DEPLOY_USER@$NEW_HOST:/home/serviceagg-deploy/incoming/$main_sha.tar.gz"
          ssh "$DEPLOY_USER@$NEW_HOST" \
            "sudo /usr/local/sbin/deploy-service-aggregator '$main_sha' '/home/serviceagg-deploy/incoming/$main_sha.tar.gz'"

      - name: Verify new server before TLS
        run: |
          curl --fail --silent --show-error --retry 15 --retry-delay 2 \
            -H 'Host: govza.pro' --output /dev/null "http://$NEW_HOST/"
          ssh "$DEPLOY_USER@$NEW_HOST" \
            'systemctl is-active --quiet service-aggregator.service && systemctl is-active --quiet nginx && systemctl is-active --quiet postgresql'

