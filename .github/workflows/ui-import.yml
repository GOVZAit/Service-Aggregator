name: Import and verify mobile UI
on:
  push:
    branches: [gpt/consistent-mobile-experience]
    paths: [.github/workflows/ui-import.yml]
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.commit.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify transfer hashes and original source
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          expected = ['8c1bbd9cb7bcc27000da8a6d88218904aeb616fbd848ce97520aae6703a0e66c','88c6298911628bac9a9b67ae7c6d0941ea57d435a6a99b5fe5ec138b3177d8b6','e24daf3727ac735408bc9768e68219f6a185f9e49bc34492aee7cd8f4df81f7c','9d685f8a7852a2bace9406ce7492940df96a5552b255c0a57d4cec7eb19a3f85']
          chunks = []
          for n, digest in enumerate(expected, 1):
              chunk = pathlib.Path(f'.github/ui-transfer/part{n}.txt').read_text().strip()
              assert hashlib.sha256(chunk.encode()).hexdigest() == digest, f'Corrupt transfer part {n}'
              chunks.append(chunk)
          raw = lzma.decompress(base64.b64decode(''.join(chunks), validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'a8805b8343f5f2e3b2d05d6d9855420826381485cc863b1ac8f1cb62d7955f2c'
          payload = json.loads(raw)
          allowed = {'client/src/components/app-brand-header.tsx','client/src/components/bottom-navigation.tsx','client/src/components/broadcast-modal.tsx','client/src/components/directory-layout.tsx','client/src/components/filter-sheet.tsx','client/src/components/master-card.tsx','client/src/components/responsive-panel.tsx','client/src/main.tsx','client/src/pages/auto-parts.tsx','client/src/pages/doctors.tsx','client/src/pages/home.tsx','client/src/pages/more.tsx','client/src/pages/profile.tsx','client/src/styles/directory.css','script/directory-ui-fixtures.ts','script/test-directory-ui.cjs'}
          assert {f['path'] for f in payload['files']} == allowed
          assert len(payload['files']) == len(allowed)
          for f in payload['files']:
              p = pathlib.Path(f['path'])
              actual = subprocess.check_output(['git','hash-object',str(p)], text=True).strip() if p.exists() else None
              assert actual == f['before'], f'Source changed: {p}'
          for f in payload['files']:
              p = pathlib.Path(f['path']); p.parent.mkdir(parents=True, exist_ok=True); p.write_text(f['content'], encoding='utf-8')
          subprocess.run(['git','add','--',*sorted(allowed)], check=True)
          print('Verified and staged 16 source files. No server, database or workflow payload changes.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check && npm run test:product && npm run build && npm run smoke:build
      - name: Commit source to review branch only
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: consistent mobile-first directories, accessible panels and compact cards'
          git push origin HEAD:refs/heads/gpt/consistent-mobile-experience
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  browser:
    needs: import
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.import.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci && npm run build
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/ui-tools" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/ui-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test production frontend with fixture APIs only
        env:
          UI_FIXTURES: ${{ runner.temp }}/ui-fixtures.json
          UI_REPORT: ${{ runner.temp }}/ui-report
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ui-tools/node_modules/playwright
        run: |
          ./node_modules/.bin/tsx script/directory-ui-fixtures.ts
          node script/test-directory-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: govza-ui-review
          path: ${{ runner.temp }}/ui-report
          retention-days: 7
