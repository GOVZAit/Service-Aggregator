name: UI review workspace
on:
  push:
    branches: [gpt/consistent-mobile-experience]
    paths: [.github/workflows/ui-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package tracked source only
        run: git archive --format=tar.gz -o "$RUNNER_TEMP/govza-ui-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: govza-ui-source
          path: ${{ runner.temp }}/govza-ui-source.tar.gz
          retention-days: 2
