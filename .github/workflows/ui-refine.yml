name: Refine reviewed mobile UI
on:
  push:
    branches: [gpt/consistent-mobile-experience]
    paths: [.github/workflows/ui-refine.yml]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded refinements to verified source
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          expected = {
            'client/src/styles/directory.css': '09e84c4c532238f4c36e0a08aa1b60d43eddca5d',
            'client/src/components/master-card.tsx': '71dd375ba34e97dc0395590003fd0d651bad5ac8',
            'client/src/pages/home.tsx': 'e66f90356f10eb7004b04fe94cf42d2c92d19592',
            'client/src/pages/auto-parts.tsx': 'ffad5b3e80e7dda217a81b83ea24a6928a80e4ff',
            'script/test-directory-ui.cjs': '633fde4c8095c4422d6f026a990366c7817cfae1',
          }
          for p, sha in expected.items():
              assert subprocess.check_output(['git','hash-object',p],text=True).strip() == sha, p
          def replace(p, old, new):
              f=pathlib.Path(p); s=f.read_text(); assert old in s, p; f.write_text(s.replace(old,new))
          css = '''
          /* Keep the search and first useful result in reach on a phone. */
          .directory-title-row { flex-wrap: wrap; }
          .directory-title-row h1 { overflow-wrap: normal; }
          .directory-city { max-width: 100%; }
          .directory-city > span { overflow-wrap: normal; }
          .directory-quick-filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
          .directory-quick-filters::-webkit-scrollbar { display: none; }
          .directory-card-master .directory-location { padding-top: 0; border-top: 0; margin-top: 10px; }
          .directory-card-master .directory-card-bottom { margin-top: 12px; }
          .directory-card-master .directory-price { margin: 0; }
          @media (max-width: 719px) {
            .directory-topbar-inner { min-height: 56px; }
            .directory-intro { padding-block: 12px 4px; }
            .directory-description { display: none; }
            .directory-search-sticky { padding-block: 8px; }
            .directory-filter-button { width: 52px; padding-inline: 8px; position: relative; }
            .directory-filter-button .filter-word { display: none; }
            .directory-filter-button .directory-counter { position: absolute; top: -5px; right: -4px; border: 2px solid hsl(var(--background)); }
            .directory-results-bar { padding-block: 10px 12px; }
            .directory-request-link { min-height: 60px; }
            .directory-card { padding: 16px; }
          }
          @media (max-width: 359px) {
            .directory-title-row { gap: 2px 12px; }
            .directory-city { max-width: 100%; white-space: nowrap; }
          }
          '''
          p=pathlib.Path('client/src/styles/directory.css'); p.write_text(p.read_text()+css)
          p='client/src/components/master-card.tsx'
          replace(p,'className="directory-card relative"','className="directory-card directory-card-master relative"')
          replace(p,'<span className="directory-metadata">Стоимость услуг</span>','')
          p='client/src/pages/home.tsx'
          replace(p,'Получите предложения и выберите мастера','Сравните предложения мастеров')
          replace(p,'className="directory-quick-actions" aria-label="Быстрые фильтры"','className="directory-quick-actions directory-quick-filters" aria-label="Быстрые фильтры"')
          replace('client/src/pages/auto-parts.tsx','Сравните цены и наличие в одной заявке','Цены и наличие в одной заявке')
          p='script/test-directory-ui.cjs'
          replace(p,"const { chromium } = require(process.env.PLAYWRIGHT_MODULE || 'playwright');", "const engines = require(process.env.PLAYWRIGHT_MODULE || 'playwright');\nconst engine = process.env.UI_BROWSER || 'chromium';\nassert.ok(['chromium', 'webkit'].includes(engine), 'Unsupported test browser');")
          replace(p,"browser = await chromium.launch({ headless: true });", "browser = await engines[engine].launch({ headless: true });")
          replace(p,"    if (url.hostname !== '127.0.0.1') return route.abort();", "    // Allow the existing public font assets; all external app/API traffic is blocked.\n    if (['fonts.googleapis.com', 'fonts.gstatic.com'].includes(url.hostname)) return route.continue();\n    if (url.hostname !== '127.0.0.1') return route.abort();")
          replace(p,"      assert.equal(await page.evaluate(() => document.activeElement.dataset.testid), id);", "      await page.waitForFunction(expected => document.activeElement?.dataset.testid === expected, id, { timeout: 2000 });\n      assert.equal(await page.evaluate(() => document.activeElement.dataset.testid), id);")
          replace(p,"basis: 'Production frontend build + isolated fixture APIs; no production DB. Chromium only.'", "basis: `Production frontend build + isolated fixture APIs; no production DB. Engine: ${engine}. Public fonts allowed; external APIs blocked.`")
          subprocess.run(['git','add','--',*expected.keys()],check=True)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci && npm run check
      - name: Save source refinements to review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: compact phone headers and cards after browser review'
          git push origin HEAD:refs/heads/gpt/consistent-mobile-experience
