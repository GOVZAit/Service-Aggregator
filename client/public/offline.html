<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B8FB6" />
  <title>Нет сети — GOVZA мастера</title>
  <style>
    :root { color-scheme: light dark; font-family: Manrope, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)); background: #f8fafc; color: #0f172a; }
    main { width: min(100%, 420px); text-align: center; }
    .logo { width: 88px; height: 88px; margin: 0 auto 24px; display: grid; place-items: center; border-radius: 28px; background: #0b8fb6; color: white; font-weight: 900; font-size: 34px; box-shadow: 0 18px 42px rgba(15, 23, 42, .18); }
    h1 { margin: 0; font-size: 28px; letter-spacing: -.04em; }
    p { margin: 12px auto 0; max-width: 34ch; color: #64748b; line-height: 1.55; }
    button { margin-top: 24px; min-height: 48px; border: 0; border-radius: 16px; padding: 0 22px; background: #0b8fb6; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #f8fafc; }
      p { color: #94a3b8; }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">G</div>
    <h1>Сейчас нет сети</h1>
    <p>GOVZA мастера откроет свежие данные, как только интернет снова станет доступен.</p>
    <button type="button" onclick="location.reload()">Попробовать снова</button>
  </main>
  <script>
    addEventListener("online", () => location.reload());
  </script>
</body>
</html>
