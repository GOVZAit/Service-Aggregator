<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="description" content="GOVZA — мастера, организации, услуги, заявки и полезные городские контакты рядом." />
    <meta name="format-detection" content="telephone=no" />
    <meta property="og:title" content="GOVZA мастера" />
    <meta property="og:description" content="Мастера, организации и городские сервисы в одном приложении." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://govza.pro/" />
    <link rel="canonical" href="https://govza.pro/" />
    <title>GOVZA мастера</title>
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0B8FB6" />
    <meta name="application-name" content="GOVZA мастера" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GOVZA мастера" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet" />

    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #f8fafc; }
      .govza-initial-boot {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
        box-sizing: border-box;
        background: #f8fafc;
        color: #0f172a;
        font-family: Manrope, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .govza-initial-boot__content { text-align: center; }
      .govza-initial-boot__mark {
        width: 80px;
        height: 80px;
        margin: 0 auto;
        display: grid;
        place-items: center;
        border-radius: 28px;
        background: #0b8fb6;
        color: #fff;
        font-family: Unbounded, Manrope, sans-serif;
        font-size: 28px;
        font-weight: 700;
        box-shadow: 0 18px 44px -24px rgba(15, 23, 42, .42);
      }
      .govza-initial-boot__name {
        margin-top: 20px;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -.04em;
      }
      .govza-initial-boot__name strong {
        color: #0b8fb6;
        font-weight: 800;
      }
      .govza-initial-boot__track {
        width: 112px;
        height: 6px;
        margin: 20px auto 0;
        overflow: hidden;
        border-radius: 999px;
        background: #e2e8f0;
      }
      .govza-initial-boot__bar {
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: #0b8fb6;
        transform-origin: left center;
        animation: govza-initial-loading 1.05s ease-in-out infinite alternate;
      }
      @keyframes govza-initial-loading {
        from { transform: translateX(-5%) scaleX(.72); opacity: .65; }
        to { transform: translateX(145%) scaleX(1); opacity: 1; }
      }
      @media (prefers-color-scheme: dark) {
        body, .govza-initial-boot { background: #111827; color: #f8fafc; }
        .govza-initial-boot__track { background: #273449; }
      }
      @media (prefers-reduced-motion: reduce) {
        .govza-initial-boot__bar { animation: none; width: 100%; opacity: .8; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="govza-initial-boot" role="status" aria-label="GOVZA мастера загружается">
        <div class="govza-initial-boot__content">
          <div class="govza-initial-boot__mark" aria-hidden="true">G</div>
          <div class="govza-initial-boot__name">GOVZA <strong>мастера</strong></div>
          <div class="govza-initial-boot__track" aria-hidden="true">
            <div class="govza-initial-boot__bar"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
